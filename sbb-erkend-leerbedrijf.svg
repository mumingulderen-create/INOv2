<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- Buitenrand / Kaart -->
  <rect x="1" y="1" width="198" height="98" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Bovenste rode blok -->
  <path d="M 1 9 C 1 4.5 4.5 1 9 1 L 191 1 C 195.5 1 199 4.5 199 9 L 199 54 L 1 54 Z" fill="#E30613"/>
  
  <!-- Teksten in rood blok -->
  <text x="14" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="900" fill="#ffffff" letter-spacing="0.2">Erkend leerbedrijf</text>
  <text x="14" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#ffffff" opacity="0.95">Wij leiden vakmensen op</text>
  
  <!-- Onderste wit blok content -->
  <g transform="translate(14, 60)">
    <!-- SBB Logo Icon (De bekende twee figuren/schakels in oranje en rood) -->
    <g transform="scale(0.85)">
      <!-- Oranje figuur links -->
      <circle cx="8" cy="8" r="4.5" fill="#F39200"/>
      <path d="M 2 15 C 2 13 4 11 8 11 C 12 11 14 13 14 15 L 14 28 C 14 31 11 34 8 34 C 5 34 2 31 2 28 Z" fill="#F39200"/>
      
      <!-- Rood figuur rechts (overlappend) -->
      <circle cx="20" cy="8" r="4.5" fill="#E30613"/>
      <path d="M 14 15 C 14 13 16 11 20 11 C 24 11 26 13 26 15 L 26 28 C 26 31 23 34 20 34 C 17 34 14 31 14 28 Z" fill="#E30613"/>
    </g>
    
    <!-- SBB Tekstblok -->
    <text x="32" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#2d3748" letter-spacing="-0.1">samenwerking</text>
    <text x="32" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#2d3748" letter-spacing="-0.1">beroepsonderwijs</text>
    <text x="32" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#2d3748" letter-spacing="-0.1">bedrijfsleven</text>
    
    <!-- Website s-bb.nl rechts -->
    <text x="172" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" fill="#E30613" text-anchor="end">s-bb.nl</text>
  </g>
</svg>
