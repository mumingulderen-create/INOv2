# Test (en optioneel deploy) van de formulieren-Worker in worker/.
# Deploy gebeurt alleen als de repository-secrets CLOUDFLARE_API_TOKEN en
# CLOUDFLARE_ACCOUNT_ID zijn ingesteld. Secrets van de Worker zelf
# (TURNSTILE_SECRET, BREVO_API_KEY) staan in Cloudflare, niet hier.
name: Formulieren-Worker

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/formulieren-worker.yml"]
  pull_request:
    paths: ["worker/**", ".github/workflows/formulieren-worker.yml"]

permissions:
  contents: read

jobs:
  test-en-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Deploy naar Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
